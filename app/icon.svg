<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">PrepNest</title>
  <desc id="desc">React-style orbit rings around a bold letter P, optimized for visibility at small sizes</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171009"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA9C0C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="13" fill="url(#bgGrad)"/>

  <!-- orbit rings, thicker strokes so they survive downscale to 16px -->
  <g fill="none" stroke="#F5F5F4" stroke-width="3">
    <ellipse cx="32" cy="32" rx="24" ry="10" opacity="0.95"/>
    <ellipse cx="32" cy="32" rx="24" ry="10" opacity="0.95" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="24" ry="10" opacity="0.95" transform="rotate(120 32 32)"/>
  </g>

  <!-- solid nucleus disc: masks the crossing ring lines so the P stays perfectly clean, just like React's logo core -->
  <circle cx="32" cy="32" r="17.5" fill="#0B0907"/>

  <!-- big bold letter P, dominant so it reads clearly even at 16px -->
  <path fill-rule="evenodd" fill="url(#pGrad)"
        d="M22 45
           L22 22
           Q22 19 25 19
           L32 19
           Q42 19 42 25.5
           Q42 32 32 32
           L28 32
           L28 45
           Z
           M28 23
           L32 23
           Q37 23 37 25.5
           Q37 28 32 28
           L28 28
           Z"/>
</svg>